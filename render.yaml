# Khi repository chỉ chứa nội dung Lab23.1, dùng Blueprint này ở root.
services:
  - type: web
    name: lab23-message-node
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: node-lab23
      - key: JWT_SECRET
        generateValue: true
